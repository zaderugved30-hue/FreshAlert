<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshAlert - Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">

    <div class="logo">
        <span class="logo-icon">🍃</span>
        FreshAlert
    </div>

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            🏠 Dashboard
        </a>

        <a href="{{ url_for('foods') }}">
            🍴 Foods
        </a>

        <a href="{{ url_for('suppliers') }}">
            🚚 Suppliers
        </a>

        <a href="{{ url_for('profile') }}" class="active">
            👤 Profile
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</div>


<!-- ================= PROFILE CONTENT ================= -->
<div class="container">

    <div class="page-header">

        <div>
            <h1>My Profile</h1>
            <p>View your FreshAlert account details.</p>
        </div>

    </div>


    <!-- ================= PROFILE CARD ================= -->
    <div class="profile-card">

        <div class="profile-top">

            <!-- PROFILE AVATAR -->
            <div class="profile-avatar">
                {{ (user.name or user.username)[0].upper() }}
            </div>

            <!-- USER NAME -->
            <h2>
                {{ user.name or user.username }}
            </h2>

            <p>FreshAlert User</p>

        </div>


        <!-- FULL NAME -->
        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                value="{{ user.name or user.username }}"
                readonly>

        </div>


        <!-- USERNAME -->
        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                value="{{ user.username }}"
                readonly>

        </div>


        <!-- ROLE -->
        <div class="form-group">

            <label>Role</label>

            <input
                type="text"
                value="{% if user.role == 'A' %}Admin{% else %}User{% endif %}"
                readonly>

        </div>

    </div>

</div>

</body>
</html>
